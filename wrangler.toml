# Cloudflare Workers config (free plan). See README → "Free hosting".
name = "burger-truck-attendance"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin", "/admin/*", "/.well-known/*"]

[vars]
TRUCK_TZ = "Africa/Cairo"

[[d1_databases]]
binding = "DB"
database_name = "burger-truck-attendance"
database_id = "b0f2378b-1607-4ab6-a1be-47bff8b26019"
migrations_dir = "migrations"
