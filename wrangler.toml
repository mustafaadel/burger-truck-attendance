# Cloudflare Workers config (free plan). See README → "Free hosting".
name = "burger-truck-attendance"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin", "/admin/*"]

[vars]
TRUCK_TZ = "Africa/Cairo"

[[d1_databases]]
binding = "DB"
database_name = "burger-truck-attendance"
database_id = "00000000-0000-0000-0000-000000000000" # filled in by `npm run deploy:setup`
migrations_dir = "migrations"
